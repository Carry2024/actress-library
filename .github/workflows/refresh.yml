name: Refresh public profiles and Gfriends references
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: write
concurrency:
  group: refresh-library
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/library.py refresh
      - run: python scripts/library.py validate
      - name: Commit checked data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update sourced profiles and portrait references'
            git push
          fi
